name: Compilation Flutter APK (Release)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    name: Compiler APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurer Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Vérifier la version Flutter
        run: flutter --version

      - name: Télécharger les dépendances (pub get)
        run: flutter pub get

      - name: Analyse statique du code
        run: flutter analyze --no-fatal-infos

      - name: Exécuter les tests unitaires
        run: flutter test

      - name: Compiler l'APK Android (Release)
        run: flutter build apk --release

      - name: Téléverser l'APK en tant qu'artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-medical-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Créer une Release GitHub avec l'APK (si tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Version ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
